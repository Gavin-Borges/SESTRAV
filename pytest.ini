[pytest]
addopts = --tb=short -q --strict-markers
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    heavy: marks tests as heavy (slow, loads model checkpoints or large data - deselect with -m 'not heavy')
    slow: marks tests as slow (network calls or multi-second runtimes)
    smoke: marks tests as smoke-level (fast sanity checks)
