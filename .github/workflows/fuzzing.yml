name: Property-Based Fuzz Testing

# Runs the Hypothesis property-based test suite against SESTRAV's core functions,
# generating adversarial/edge-case inputs on every push, PR and weekly schedule.
#
# This does NOT satisfy OSSF Scorecard's automated Fuzzing check. Verified live
# against api.securityscorecards.dev on 2026-08-23, bound to commit 36e3d8d
# (Scorecard v5.5.0, analysis date 2026-08-22T23:00:34Z): score 0, reason "project
# is not fuzzed", details "Warn: no fuzzer integrations found". Per that Scorecard
# version's own docs, its Fuzzing probe recognizes OSS-Fuzz registration,
# ClusterFuzzLite, Go's native fuzzing, and property-based testing libraries for
# Haskell, JS/TS, Erlang and C#/F# only - there is no Python detector, so this
# suite cannot register no matter how it is written:
# https://scorecard.dev/checks/#fuzzing
#
# Tests are in tests/test_fuzz.py and exercise compute_features and get_tcr_positions
# under adversarial/edge-case inputs using Hypothesis.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly extended fuzz run (Saturday 02:00 UTC) with higher max_examples
    - cron: '0 2 * * 6'

permissions: read-all

jobs:
  fuzz:
    name: Hypothesis Property-Based Fuzzing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install CPU PyTorch (no CUDA needed for fuzz tests)
        # Hash-pinned like every other workflow (--require-hashes --no-deps) so the
        # fuzz job does not break the repo-wide pinned-dependency guarantee.
        run: pip install --no-deps --require-hashes -r environments/requirements-ci-torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install --no-deps --require-hashes -r requirements.txt
          pip install --no-deps --require-hashes -r environments/requirements-ci.txt

      - name: Run Hypothesis fuzz tests
        # HYPOTHESIS_MAX_EXAMPLES controls depth; 200 on push/PR, 1000 on schedule.
        # Seed: fixed (0) on push/PR for reproducibility; random on schedule to
        # broaden the example space across weekly runs.
        env:
          HYPOTHESIS_MAX_EXAMPLES: ${{ github.event_name == 'schedule' && '1000' || '200' }}
        run: |
          SEED=''
          [ "${{ github.event_name }}" != "schedule" ] && SEED='--hypothesis-seed=0'
          python -m pytest tests/test_fuzz.py -v \
            --tb=short \
            -p hypothesis \
            $SEED

      - name: Upload Hypothesis database (persists failure examples between runs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypothesis-database
          path: .hypothesis/
          retention-days: 30
