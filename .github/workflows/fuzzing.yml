name: Property-Based Fuzz Testing

# Runs the Hypothesis property-based test suite against SESTRAV's core functions,
# generating adversarial/edge-case inputs on pushes to main, pull requests targeting
# main, and a weekly schedule. Not "every push": the triggers below are branch-scoped,
# so a push to a feature branch does not fire this workflow - only the pull request
# that targets main does.
#
# THIS SUITE does NOT satisfy OSSF Scorecard's automated Fuzzing check. Scorecard
# has no detector for Hypothesis, or for any property-based Python library. Its
# only Python detector is Atheris, matched on the source pattern `import atheris`
# (languageFuzzSpecs in checks/raw/fuzzing.go at ossf/scorecard c395761):
# https://scorecard.dev/checks/#fuzzing
#
# THE CHECK ITSELF IS NOW SATISFIED, which this header used to deny. Read from
# api.securityscorecards.dev on 2026-10-02, for the scorecard.yml run of
# 2026-10-01 on commit 153d2b06 (Scorecard v5.5.0): Fuzzing scores 10, reason
# "project is fuzzed". It reports TEN matches, not nine. Nine are the fuzz/
# harnesses that each `import atheris`. The tenth is in tests/, and it is not an
# import at all: tests/test_fuzz_harness_support.py asserts that every harness
# imports atheris, and the pattern appears inside that assertion's own failure
# message. A bare per-line regex over *.py cannot tell a string literal from an
# import. Separately, from GitHub's code-scanning API, alert FuzzingID (#13)
# closed as fixed at 2026-09-30T14:32:03Z, by an earlier run than the one above.
# The detector reads source and never inspects runs, so the check is satisfied
# even though no workflow executes those harnesses - and the tenth match is the
# sharpest evidence of that, being a test rather than a fuzzer. Keep the
# distinction: the check passing is not this suite passing it.
#
# Superseded, kept as the dated record it was: read on 2026-08-23 against commit
# 36e3d8d (Scorecard v5.5.0, analysis date 2026-08-22T23:00:34Z), Fuzzing scored
# 0, reason "project is not fuzzed", details "Warn: no fuzzer integrations
# found". This header also used to say that registering the check "would require
# an Atheris harness, OSS-Fuzz registration, or ClusterFuzzLite - so it is
# reachable, just not by this suite as written". That sentence was not falsified;
# it was SATISFIED. An Atheris harness is exactly what registered the check, and
# its closing clause, that the check is not reachable by this suite as written,
# is the part this header keeps as still true. What went stale is only the
# implication that the requirement was still outstanding.
#
# Tests are in tests/test_fuzz.py and exercise compute_features and get_tcr_positions
# under adversarial/edge-case inputs using Hypothesis.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly extended fuzz run (Saturday 02:00 UTC) with higher max_examples
    - cron: '0 2 * * 6'

permissions: read-all

jobs:
  fuzz:
    name: Hypothesis Property-Based Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          # Every file this job installs from, not setup-python's default of
          # **/requirements.txt. The default keys on the root file alone, so a
          # change confined to environments/ leaves the key unchanged, hits the
          # primary key, and setup-python then SKIPS the save. The new wheels are
          # re-downloaded on every subsequent run and never cached, until the root
          # file happens to change. All three are hash-pinned and installed below.
          cache-dependency-path: |
            requirements.txt
            environments/requirements-ci.txt
            environments/requirements-pip-bootstrap.txt
            environments/requirements-ci-torch-cpu.txt

      - name: Install CPU PyTorch (no CUDA needed for fuzz tests)
        # Hash-pinned like every other workflow (--require-hashes --no-deps) so the
        # fuzz job does not break the repo-wide pinned-dependency guarantee.
        run: pip install --no-deps --require-hashes -r environments/requirements-ci-torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        # Hash-pinned pip, then hash-checked setuptools, then no build isolation, so the
        # connection-pool sdist in requirements-ci.txt is not built against a
        # setuptools downloaded unhashed, and the pip cache cannot hand back a wheel
        # an earlier run built in isolation: see ci.yml's compat job.
        run: |
          pip install --no-deps --require-hashes -r environments/requirements-pip-bootstrap.txt
          pip install --no-deps --require-hashes -c requirements.txt setuptools
          pip cache remove connection_pool
          pip install --no-deps --require-hashes --no-build-isolation -r requirements.txt
          pip install --no-deps --require-hashes --no-build-isolation -r environments/requirements-ci.txt

      - name: Run Hypothesis fuzz tests
        # HYPOTHESIS_MAX_EXAMPLES controls depth; 200 on push/PR, 1000 on schedule.
        # Seed: fixed (0) on push/PR for reproducibility; random on schedule to
        # broaden the example space across weekly runs.
        env:
          HYPOTHESIS_MAX_EXAMPLES: ${{ github.event_name == 'schedule' && '1000' || '200' }}
        run: |
          SEED=''
          [ "${{ github.event_name }}" != "schedule" ] && SEED='--hypothesis-seed=0'
          python -m pytest tests/test_fuzz.py -v \
            --tb=short \
            -p hypothesis \
            $SEED

      - name: Upload Hypothesis database (persists failure examples between runs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypothesis-database
          path: .hypothesis/
          retention-days: 30
