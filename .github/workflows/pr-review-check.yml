name: PR Review Enforcement

# Runs on every pull request targeting the main branch.
# This workflow acts as the mandatory status check that the branch ruleset requires.
# It enforces an approving human review for EXTERNAL contributors ONLY. Pull requests
# from the repository owner (the sole maintainer) and from trusted dependency bots
# bypass the requirement - see the bypass branches below. It therefore does NOT
# establish independent review for owner-authored changes, which are the large
# majority of merges. SESTRAV is solo-maintained; the required CI checks, not a second
# reviewer, are the real gate on those changes. See BUS_FACTOR.md.
# Scorecard Code-Review check (https://scorecard.dev/checks/#code-review) monitors
# whether recent changesets were approved before merging.

on:
  pull_request:
    branches: [main]
  pull_request_review:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-required:
    name: Require human review
    runs-on: ubuntu-latest

    steps:
      - name: Check for at least one approving review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request || (context.payload.review && context.payload.review.pull_request);
            if (!pr) {
              core.setFailed('Could not find pull request in payload.');
              return;
            }

            const prNumber = pr.number;
            const prAuthor = pr.user.login;
            const repoOwner = context.repo.owner;

            // If the PR is created by the repo owner (sole maintainer), bypass review check
            if (prAuthor === repoOwner) {
              core.info(
                `ℹ️ PR created by repository owner & sole maintainer (${prAuthor}). ` +
                'Bypassing review approval requirement to allow frictionless self-merging.'
              );
              return;
            }

            // Trusted bots (Dependabot, Renovate) cannot be assigned as reviewers and
            // their PRs are gated by 15+ CI checks. Bypass the human-review requirement.
            const TRUSTED_BOTS = ['dependabot[bot]', 'renovate[bot]'];
            if (TRUSTED_BOTS.includes(prAuthor)) {
              core.info(
                `ℹ️ PR created by trusted dependency bot (${prAuthor}). ` +
                'Bypassing human-review requirement; CI suite enforces correctness.'
              );
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: repoOwner,
              repo:  context.repo.repo,
              pull_number: prNumber,
            });

            // Two filters, both added 2026-09-13. Before them this counted ANY
            // review whose state was APPROVED, which made the check satisfiable by
            // any account that can see a public PR, and counted superseded
            // approvals that the reviewer had already replaced.

            // 1. Collapse to each reviewer's LATEST review. listReviews returns the
            //    full history, so an APPROVED that was later replaced by
            //    CHANGES_REQUESTED still appears in the raw list. The ruleset's
            //    dismiss_stale_reviews_on_push covers a new push; it does not cover
            //    a reviewer changing their own mind.
            const latestByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user && review.user.login;
              if (!login) continue;
              if (review.state === 'COMMENTED') continue;  // never supersedes a verdict
              latestByReviewer.set(login, review);
            }

            // 2. Require write-level standing. author_association is OWNER for the
            //    repository owner, MEMBER for an org member and COLLABORATOR for an
            //    invited collaborator; CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR and NONE
            //    are any other account and carry no permission at all.
            const TRUSTED_ASSOCIATIONS = ['OWNER', 'MEMBER', 'COLLABORATOR'];

            const approvals = [...latestByReviewer.values()].filter(
              r => r.state === 'APPROVED' &&
                   TRUSTED_ASSOCIATIONS.includes(r.author_association) &&
                   r.user.login !== prAuthor
            );

            if (approvals.length === 0) {
              const seen = [...latestByReviewer.values()]
                .map(r => `${r.user.login} (${r.state}, ${r.author_association})`)
                .join(', ') || 'none';
              // Hard-fail so this status check blocks the merge for external contributors.
              core.setFailed(
                'No approving review from a repository owner, organization member or ' +
                'collaborator. This PR requires at least 1 such approval before merge. ' +
                `Latest review per reviewer: ${seen}. See CODEOWNERS for required reviewers.`
              );
            } else {
              core.info(
                `✅ Found ${approvals.length} approving review(s). Review requirement satisfied.`
              );
            }
