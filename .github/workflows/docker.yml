name: Build and publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'          # publish on versioned tags only
  workflow_dispatch:      # allow manual trigger for testing

permissions:
  contents: read          # minimum top-level permission

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write     # push to GHCR (job-scoped, not top-level)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sestrav
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Publishing is gated on the TAG trigger, not on the workflow running.
      # `workflow_dispatch` is documented above as a manual trigger "for testing",
      # but `push` was unconditional, so a dispatch run published to public GHCR -
      # there was no way to exercise this Dockerfile without releasing it, and no
      # workflow builds it on push or PR. A dispatch run now builds and loads the
      # image locally so the smoke test can exercise it, and publishes nothing.
      #
      # `load` and `push` are mutually exclusive in buildx, hence the inverse
      # condition. Attestations are dropped on the dry run because provenance and
      # SBOM require the registry exporter and fail under the docker exporter that
      # `load` uses; that is a property of the exporter, not a weakening of the
      # release path, which still sets both.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name == 'push' }}   # SLSA build provenance attestation
          sbom: ${{ github.event_name == 'push' }}         # Software Bill of Materials

      # On a tag run the image only exists in the registry, so it is pulled back -
      # that also proves the push succeeded. On a dispatch run it is already in the
      # local daemon from `load`, and pulling would fail because nothing was pushed.
      - name: Smoke-test image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          if [ "${{ github.event_name }}" = "push" ]; then
            docker pull "$IMAGE"
          fi
          docker run --rm "$IMAGE" info
