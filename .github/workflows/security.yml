name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly Monday 06:00 UTC sweep: catches CVEs newly disclosed against
    # already-pinned dependencies that PR-triggered scans would never re-check.
    - cron: '0 6 * * 1'

permissions: read-all

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install --require-hashes -r environments/requirements-security.txt

      - name: Run Bandit
        # Scans recursively, skipping tests and virtual environment directories.
        # Gate fails on MEDIUM+ severity findings (-ll); low-severity style findings
        # (e.g. subprocess use in dev scripts, asserts, try/except/pass) are reported
        # by CodeQL/Semgrep but do not block the release per OpenSSF guidance.
        run: bandit -r . -ll -x ./tests/,./.ci_test_venv/,./.venv/,./build/

  secret-pattern-scan:
    name: Custom Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Scan for credential-like patterns
        # Blocking gate: exits 1 if any high-entropy credential-like assignment
        # is found in tracked source files. No external dependencies - pure stdlib.
        run: python scripts/check_secrets.py

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

  semgrep:
    name: Semgrep Security Scan (advisory)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   pip-compile --generate-hashes environments/requirements-semgrep.in
        run: pip install --require-hashes -r environments/requirements-semgrep.txt

      # Advisory gate (OpenSSF tier: non-blocking). `semgrep scan` exits non-zero
      # on any finding, so without continue-on-error this step silently blocked
      # merges. Findings are surfaced as tracked, dismissable alerts in the
      # Security > Code scanning tab via the SARIF upload below instead.
      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config p/python --config semgrep-rules/ --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  pip-audit:
    name: pip-audit Dependency Scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   pip-compile --generate-hashes environments/requirements-pip-audit.in
        run: pip install --require-hashes -r environments/requirements-pip-audit.txt

      # Advisory gate (OpenSSF tier: non-blocking). Audits the INSTALLED,
      # hash-pinned production set. We install the lock first and audit the
      # resulting environment rather than `pip-audit -r environments/requirements.lock`:
      # that form re-resolves the lock in a throwaway venv and dies with
      # ResolutionImpossible, because the lock deliberately floors setuptools>=83
      # over torch's `setuptools<82` metadata cap (see environments/requirements-lock.in).
      # `pip install --require-hashes --no-deps` installs the exact pinned set with
      # no resolution step - the same path runtime uses - so setuptools 83 and torch
      # coexist and the audit covers the real dependency set. Dependabot also tracks
      # these in the Security tab; this surfaces them inline in CI and on the run
      # summary so they are visible without leaving the PR.
      #
      # Risk-accepted advisories are suppressed here with verified IDs and logged
      # in SECURITY.md's Risk-Acceptance Register. To accept a new one, add its
      # ID below with a comment and a matching register entry - never suppress
      # without one. PYSEC ids are matched by pip-audit's PyPI source; GHSA ids
      # are kept alongside for traceability with Dependabot/Security-tab reports.
      - name: Install the pinned lockfile (resolver-free) for auditing
        # continue-on-error mirrors the SBOM job below: a heavy or platform-specific
        # wheel may not install on this runner. The guard two steps down asserts the
        # real production set was audited, so a partial install is caught, not masked.
        continue-on-error: true
        run: pip install --require-hashes --no-deps -r environments/requirements.lock

      - name: Audit installed dependency set
        continue-on-error: true
        run: |
          pip-audit \
            --desc \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln GHSA-rrmf-rvhw-rf47
            # ^ CVE-2025-3000 (torch.jit.script) - no upstream patch; torch.jit.script
            #   is never called in SESTRAV. Risk-accepted, see SECURITY.md register.

      - name: Assert pip-audit tooling actually ran (fail on TOOLING error only)
        # The advisory audit above is continue-on-error so real CVE findings do not
        # block merges. That also masks a TOOLING failure (crash, unparseable output,
        # incomplete install) as a clean pass. This guard re-runs pip-audit in JSON
        # mode over the installed environment and fails the JOB only when the
        # production set was not actually audited - findings themselves are ignored
        # here (they are routed to the run summary and the Security tab). It requires
        # a parseable report AND a core production dependency present, so an empty or
        # tooling-only environment cannot pass as a clean scan.
        run: |
          set -o pipefail
          pip-audit \
            --format json \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln GHSA-rrmf-rvhw-rf47 \
            --output pip-audit-report.json || true
          python - <<'PY'
          import json, sys
          try:
              with open("pip-audit-report.json") as fh:
                  data = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"::error::pip-audit produced no parseable report: {exc}")
              sys.exit(1)
          deps = data.get("dependencies")
          if not isinstance(deps, list) or not deps:
              print("::error::pip-audit report has no dependencies - tooling failure, not a clean scan")
              sys.exit(1)
          names = {str(d.get("name", "")).lower() for d in deps}
          # Sentinel: core production deps that always ship a manylinux wheel. Their
          # absence means the lockfile did not install, so pip-audit only saw its own
          # tooling env - not the production set. Fail loudly rather than pass empty.
          sentinels = {"scikit-learn", "numpy", "pandas"}
          if not (names & sentinels):
              print(f"::error::audit did not cover the production set (none of "
                    f"{sorted(sentinels)} among {len(deps)} packages) - lockfile install failed")
              sys.exit(1)
          print(f"pip-audit tooling OK: audited {len(deps)} installed packages")
          PY

      - name: Write triage digest to run summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## pip-audit - installed production dependency set"
            echo ""
            pip-audit --format markdown \
              --ignore-vuln PYSEC-2025-194 --ignore-vuln GHSA-rrmf-rvhw-rf47 || true
          } >> "$GITHUB_STEP_SUMMARY"

  python-sbom:
    name: Python SBOM (pip-licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pip-licenses
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   pip download pip-licenses==5.5.5 -d /tmp/sbom_pkgs && pip hash /tmp/sbom_pkgs/*.whl
        run: pip install --require-hashes -r environments/requirements-sbom.txt

      - name: Install pinned dependencies for SBOM scan
        # pip-licenses reports on installed packages; install the fully-pinned
        # lockfile so the SBOM covers the exact production dependency set.
        # --no-deps: trust the resolved set, do not re-resolve.
        # continue-on-error: some platform-specific wheels (CUDA, etc.) may be
        # absent on this runner; pip-licenses will report on what installed.
        continue-on-error: true
        run: pip install --require-hashes --no-deps -r environments/requirements.lock

      - name: Generate Python SBOM
        run: |
          pip-licenses --format=json --output-file=sbom.json
          pip-licenses --format=markdown --output-file=DEPENDENCY_LICENSES.md

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom
          path: |
            sbom.json
            DEPENDENCY_LICENSES.md
          retention-days: 90
