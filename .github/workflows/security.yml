name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly Monday 06:00 UTC sweep: catches CVEs newly disclosed against
    # already-pinned dependencies that PR-triggered scans would never re-check.
    - cron: '0 6 * * 1'

permissions: read-all

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install --require-hashes -r environments/requirements-security.txt

      - name: Run Bandit
        # Scans recursively, skipping tests and virtual environment directories.
        # Gate fails on MEDIUM+ severity findings (-ll); low-severity style findings
        # (e.g. subprocess use in dev scripts, asserts, try/except/pass) are reported
        # by CodeQL/Semgrep but do not block the release per OpenSSF guidance.
        run: bandit -r . -ll -x ./tests/,./.ci_test_venv/,./.venv/,./build/

  secret-pattern-scan:
    name: Custom Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Scan for credential-like patterns
        # Blocking gate: exits 1 if any high-entropy credential-like assignment
        # is found in tracked source files. No external dependencies - pure stdlib.
        run: python scripts/check_secrets.py

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
          # SEC-3. Without this input CodeQL runs only the `default` query
          # suite. `security-extended` adds the lower-precision security
          # queries that default omits - more findings, and a higher
          # false-positive rate.
          #
          # CodeQL BLOCKS here; it is not advisory like the semgrep and
          # pip-audit jobs below. Verified against the live configuration
          # 2026-08-22: ruleset 16846770 ("Protect Main Branch", active)
          # carries a code_scanning rule naming CodeQL with
          # security_alerts_threshold "all" and alerts_threshold
          # "errors_and_warnings", so any alert a pull request INTRODUCES
          # holds the merge until it is fixed or dismissed. The extended
          # suite's false positives therefore cost a triage-and-dismiss
          # rather than a line in a report - accepted deliberately, because
          # the alternative is never running the queries that find the true
          # positives (e.g. py/log-injection alert #79 on api/main.py).
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  semgrep:
    name: Semgrep Security Scan (advisory)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   pip-compile --generate-hashes environments/requirements-semgrep.in
        run: pip install --require-hashes -r environments/requirements-semgrep.txt

      # Advisory gate (OpenSSF tier: non-blocking). `semgrep scan` exits non-zero
      # on any finding, so without continue-on-error this step silently blocked
      # merges. Findings are surfaced as tracked, dismissable alerts in the
      # Security > Code scanning tab via the SARIF upload below instead.
      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config p/python --config semgrep-rules/ --sarif --output semgrep.sarif

      # GitHub code scanning ignores SARIF `suppressions`. Semgrep honours an inline
      # `# nosemgrep` in its own verdict but still writes the finding into the SARIF
      # tagged {"state": "accepted"} with no `kind`, and the ingester stores it as an
      # OPEN alert regardless. The two views then disagree: `semgrep scan` prints
      # "0 findings" while the uploaded analysis carries results. Worse, the alert is
      # held closed only by a manual dismissal, which GitHub matches on the finding's
      # line hash - so editing a suppressed line drops the dismissal and the alert
      # returns (2026-08-17: alerts #77 and #78, after the suppression repair in
      # aa5825c). Dropping suppressed results makes the upload agree with the scan.
      # Only explicitly suppressed findings are removed; anything new still surfaces.
      - name: Drop nosemgrep-suppressed results from the SARIF
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("semgrep.sarif")
          if not path.exists():
              raise SystemExit(0)
          doc = json.loads(path.read_text(encoding="utf-8"))
          dropped = 0
          for run in doc.get("runs", []):
              kept = []
              for result in run.get("results", []):
                  if result.get("suppressions"):
                      dropped += 1
                  else:
                      kept.append(result)
              run["results"] = kept
          path.write_text(json.dumps(doc), encoding="utf-8")
          print(f"Dropped {dropped} suppressed result(s) from semgrep.sarif")
          PY

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  pip-audit:
    name: pip-audit Dependency Scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   pip-compile --generate-hashes environments/requirements-pip-audit.in
        run: pip install --require-hashes -r environments/requirements-pip-audit.txt

      # Advisory gate (OpenSSF tier: non-blocking). Audits the INSTALLED,
      # hash-pinned production set. We install the lock first and audit the
      # resulting environment rather than `pip-audit -r environments/requirements.lock`.
      # Historically that form was impossible: it re-resolves the lock in a throwaway
      # venv and died with ResolutionImpossible, because the lock floors
      # setuptools>=83 and torch 2.12.0 capped it at <82. torch 2.13.0 dropped that
      # cap, so the direct form is no longer blocked by it - but the installed-set
      # form is kept deliberately, because it audits the exact artifact set runtime
      # installs (`--require-hashes --no-deps`, no resolution step) rather than
      # whatever a fresh resolve produces. Dependabot also tracks these in the
      # Security tab; this surfaces them inline in CI and on the run summary so they
      # are visible without leaving the PR.
      #
      # NOTE: Dependabot parses `.in` sources, not compiled `.lock`/`.txt`
      # artifacts, so a resolved-but-vulnerable pin in a lockfile raises no alert.
      # This job is the only thing that SEES those - the step below is what ENFORCES
      # on what it sees.
      #
      # No pip-audit invocation below carries `--ignore-vuln`. Suppression lives
      # entirely in environments/accepted_advisories.toml, enforced by the fail-closed
      # step at the bottom of this job (tools/check_lockfile_advisories.py). A CLI
      # suppression flag is invisible in any report pip-audit produces - it is applied
      # before the JSON is written - so nothing that reads pip-audit's own output can
      # ever notice a suppressed finding, whether it is still vulnerable or has since
      # been fixed. That is exactly how CVE-2025-3000 sat patched-but-unnoticed for
      # four weeks (see PR #205 / SECURITY.md). To accept a new advisory, add it to
      # environments/accepted_advisories.toml with a matching SECURITY.md
      # Risk-Acceptance Register entry that carries a re-review trigger - never
      # suppress without one.
      - name: Install the pinned lockfile (resolver-free) for auditing
        # continue-on-error mirrors the SBOM job below: a heavy or platform-specific
        # wheel may not install on this runner. The guard two steps down asserts the
        # real production set was audited, so a partial install is caught, not masked.
        continue-on-error: true
        run: pip install --require-hashes --no-deps -r environments/requirements.lock

      - name: Audit installed dependency set
        continue-on-error: true
        run: pip-audit --desc

      - name: Assert pip-audit tooling actually ran (fail on TOOLING error only)
        # The advisory audit above is continue-on-error so real CVE findings do not
        # block merges here - the fail-closed advisory gate below does that instead,
        # against an allowlist rather than blocking on every finding. This step masks
        # only a TOOLING failure (crash, unparseable output, incomplete install), not
        # a real finding. It re-runs pip-audit in JSON mode over the installed
        # environment (unfiltered - no --ignore-vuln) and fails the JOB only when the
        # production set was not actually audited. It requires a parseable report AND
        # a core production dependency present, so an empty or tooling-only
        # environment cannot pass as a clean scan. The report this step writes is
        # consumed as-is by the next step - do not add --ignore-vuln here.
        run: |
          set -o pipefail
          pip-audit --format json --output pip-audit-report.json || true
          python - <<'PY'
          import json, sys
          try:
              with open("pip-audit-report.json") as fh:
                  data = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"::error::pip-audit produced no parseable report: {exc}")
              sys.exit(1)
          deps = data.get("dependencies")
          if not isinstance(deps, list) or not deps:
              print("::error::pip-audit report has no dependencies - tooling failure, not a clean scan")
              sys.exit(1)
          names = {str(d.get("name", "")).lower() for d in deps}
          # Sentinel: core production deps that always ship a manylinux wheel. Their
          # absence means the lockfile did not install, so pip-audit only saw its own
          # tooling env - not the production set. Fail loudly rather than pass empty.
          sentinels = {"scikit-learn", "numpy", "pandas"}
          if not (names & sentinels):
              print(f"::error::audit did not cover the production set (none of "
                    f"{sorted(sentinels)} among {len(deps)} packages) - lockfile install failed")
              sys.exit(1)
          print(f"pip-audit tooling OK: audited {len(deps)} installed packages")
          PY

      - name: Fail on unaccepted lockfile advisories
        # The actual fail-closed gate. Consumes the same pip-audit-report.json the
        # step above just wrote - unfiltered, no --ignore-vuln - so a suppressed
        # advisory cannot hide from it the way it could hide from a CLI flag. NOT
        # continue-on-error: this step turns the `pip-audit` JOB red, unlike the
        # advisory audit above it. Corrected 2026-08-22: this comment used to say it
        # "is supposed to block a merge", which it cannot - `pip-audit` is not among
        # ruleset 16846770's five required status checks (`test (3.13)`, `Require
        # human review`, `check_dco`, `Cited commits resolve`, `Cited lines still
        # hold their content`), so a red job here
        # does not gate the merge button. CodeQL is the only scanner that blocks,
        # via the ruleset's code-scanning rule. Failing the job is still the point:
        # it is the visible, fail-closed signal. See SECURITY.md's CI gate map,
        # which states the same distinction.
        run: python tools/check_lockfile_advisories.py pip-audit-report.json

      - name: Write triage digest to run summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## pip-audit - installed production dependency set"
            echo ""
            pip-audit --format markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

  python-sbom:
    name: Python SBOM (pip-licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pip-licenses
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   pip download pip-licenses==5.5.5 -d /tmp/sbom_pkgs && pip hash /tmp/sbom_pkgs/*.whl
        run: pip install --require-hashes -r environments/requirements-sbom.txt

      - name: Install pinned dependencies for SBOM scan
        # pip-licenses reports on installed packages; install the fully-pinned
        # lockfile so the SBOM covers the exact production dependency set.
        # --no-deps: trust the resolved set, do not re-resolve.
        # continue-on-error: some platform-specific wheels (CUDA, etc.) may be
        # absent on this runner; pip-licenses will report on what installed.
        continue-on-error: true
        run: pip install --require-hashes --no-deps -r environments/requirements.lock

      - name: Generate Python SBOM
        # --ignore-packages excludes the SBOM tooling itself and the runner's own
        # bootstrap. pip-licenses reports whatever is installed, and this job installs
        # pip-licenses (plus prettytable/wcwidth from environments/requirements-sbom.txt)
        # alongside the production lockfile; pip and wheel come preinstalled on the
        # runner. None of the five is a production dependency - verified absent from
        # environments/requirements.lock, which does pin setuptools, so setuptools is
        # deliberately NOT excluded. Without this, the documented fix path (commit the
        # generated artifact wholesale) would bake the SBOM tooling into the production
        # SBOM, over-reporting the dependency set - the mirror of the under-reporting
        # this job's freshness gate exists to catch.
        run: |
          pip-licenses --format=json --output-file=sbom.json \
            --ignore-packages pip-licenses prettytable wcwidth pip wheel
          pip-licenses --format=markdown --output-file=DEPENDENCY_LICENSES.md \
            --ignore-packages pip-licenses prettytable wcwidth pip wheel

      - name: Upload SBOM artifact
        # Uploaded BEFORE the freshness gate below, and with `if: always()`, so the
        # regenerated artifacts are downloadable even on a failing run - that download
        # is the documented fix path for the gate.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom
          path: |
            sbom.json
            DEPENDENCY_LICENSES.md
          retention-days: 90

      # Fail-closed freshness gate. docs/sbom.json and docs/DEPENDENCY_LICENSES.md are
      # committed pip-licenses output, but nothing regenerated them on a schedule and
      # nothing compared them against the lockfile, so they drifted silently: as of
      # 2026-08-05 they were last generated 2026-06-26 and 46 of the 124 packages they
      # share with environments/requirements.lock disagreed with it. Four disagreed in
      # the security-relevant direction, advertising torch 2.12.0, cryptography 48.0.0,
      # gitpython 3.1.46 and aiohttp 3.13.5 when the repo already pinned 2.13.0, 50.0.0,
      # 3.1.57 and 3.14.3. A supply-chain artifact that understates its own project's
      # posture is worse than none, because downstream tooling reads it as authoritative.
      #
      # These compare what was just generated from the pinned lockfile against what is
      # committed. NOT continue-on-error: they are meant to block. A version
      # disagreement fails, and so does a package present in the generated set but
      # absent from the committed one (that is how a deleted or tampered row shows up).
      # The reverse - committed but not regenerated - is a notice only, because the
      # lockfile install above is continue-on-error and platform wheels (CUDA etc.)
      # legitimately fail on this runner.
      #
      # EXPECTED TO FAIL ON ITS FIRST RUN, by design: the committed artifacts are
      # genuinely stale and the fix is to download the `python-sbom` artifact uploaded
      # by the step above and commit both files over the copies in docs/. They were
      # deliberately not hand-patched, because editing individual rows would fabricate
      # freshness in a supply-chain attestation. Note that correction will also SHRINK
      # the committed artifacts: they currently carry 214 packages captured in a local
      # dev environment, while a CI run produces the lockfile set minus any wheel that
      # does not build on the runner. A large row-count drop on that commit is expected,
      # not tampering.
      #
      # After that one commit this stays green until the audited dependency set changes.
      # That is usually a lockfile bump, but not only: a GitHub runner image refresh can
      # move a preinstalled package and turn this red with the lockfile untouched. Every
      # such failure is resolved by the same regenerate-and-commit path.
      #
      # Two separate steps on purpose: GitHub runs `run:` blocks under `bash -e`, so
      # chaining both invocations in one block would abort on the first failure and
      # never compare the second artifact - which matters precisely on the first red run.
      # Both carry `!cancelled()` so neither is skipped when the other fails, while a
      # genuinely cancelled job still stops.
      - name: Fail on stale committed sbom.json
        if: ${{ !cancelled() }}
        run: python tools/check_sbom_freshness.py --generated sbom.json --committed docs/sbom.json

      - name: Fail on stale committed DEPENDENCY_LICENSES.md
        if: ${{ !cancelled() }}
        run: |
          python tools/check_sbom_freshness.py \
            --generated DEPENDENCY_LICENSES.md --committed docs/DEPENDENCY_LICENSES.md
