name: Doc Line Citations

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check_doc_line_citations:
    name: Cited lines still hold their content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify every pinned path:NNN citation still points at its content
        # Line citations rot whenever anything upstream of them changes, and
        # they stay pointed at a real file and a line that exists, so neither
        # an existence check nor an end-of-file check sees it. The baseline in
        # docs/line_citations.json records what each cited line held when a
        # human last confirmed it; this fails the build when that stops being
        # true. Regenerate with --update, then read the diff.
        run: python scripts/check_doc_line_citations.py
