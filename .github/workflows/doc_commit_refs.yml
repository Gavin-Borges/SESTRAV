name: Doc Commit References

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check_doc_commit_refs:
    name: Cited commits resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: abbreviated SHAs cited in docs cannot be resolved
          # from a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify every commit SHA cited in tracked docs still resolves
        # Reachability is measured from HEAD. For a pull request that is the
        # merge commit, which is exactly the state a reader will clone after
        # merge - so citing an earlier commit of this same PR is allowed,
        # while a commit reachable from no ref is still reported.
        run: python scripts/check_doc_commit_refs.py
