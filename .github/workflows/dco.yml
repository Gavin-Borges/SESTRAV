name: DCO
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  check_dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check Developer Certificate of Origin (DCO)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Bots (Dependabot, Renovate, etc.) cannot cryptographically sign commits;
          # exempt them from the DCO requirement - their PRs are reviewed by CI instead.
          if [[ "$PR_AUTHOR" == *"[bot]" ]]; then
            echo "Skipping DCO check for bot PR (author: ${PR_AUTHOR})."
            exit 0
          fi

          # Fetch the target branch
          git fetch origin "$BASE_REF"
          # Check all commits in the PR for the Signed-off-by trailer.
          # --no-merges skips GitHub's auto-created test-merge commit
          # (refs/pull/<N>/merge), which never carries a sign-off trailer.
          for commit in $(git rev-list --no-merges "origin/$BASE_REF"..HEAD); do
            if ! git show -s --format=%B $commit | grep -qi "Signed-off-by:"; then
              echo "::error::Commit $commit is missing the Developer Certificate of Origin (DCO) Signed-off-by trailer."
              echo "Please use 'git commit -s' to sign off your commits."
              exit 1
            fi
          done
          echo "All commits have DCO sign-offs."
