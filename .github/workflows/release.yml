name: Release (signed + provenance)

# Builds the Python distribution on a version tag, generates a SHA-256 manifest,
# produces a keyless SLSA build-provenance attestation (Sigstore via GitHub OIDC -
# no maintainer-managed signing keys), and publishes everything to a GitHub
# Release. Consumers can cryptographically verify an artifact came from this
# repo's CI with:
#
#   gh attestation verify <artifact> --repo Gavin-Borges/SESTRAV
#
# Whether that counts as OpenSSF `signed_releases` being met is a separate
# question: what the Best Practices badge form and Scorecard's Signed-Releases
# check record, with dates, is in docs/security_compliance.md ("Future Upgrades").
#
# See docs/releasing.md and SECURITY.md "Release Integrity & Verification".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # sha256 of every file in the release-input artifact; see the step that
      # records them. The release job checks its download against this.
      artifact-sha256: ${{ steps.digests.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Record the tagged commit's date
        # Read here rather than inside the gate: that step's run body is asserted to be
        # exactly a `python - <<'PY'` heredoc carrying no workflow expression, so it cannot
        # shell out first. %cs is the committer date as YYYY-MM-DD.
        run: echo "COMMIT_DATE=$(git show -s --format=%cs HEAD)" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        # Fail fast (before building) if the pushed tag does not match
        # pyproject.toml [project].version, so release artifacts can never be
        # mislabelled. Bump pyproject before tagging (see docs/releasing.md).
        #
        # CITATION.cff is checked here too. Until 2026-08-14 nothing in CI, the
        # tests, the scripts or the integrity harness referenced that file at
        # all, which is how the W6 "phantom release" happened: CITATION.cff
        # advertised 2.1.0 dated 2026-08-07 while no such tag existed.
        #
        # CITATION.cff is YAML, but this step runs before any dependency is
        # installed, so there is no YAML parser available. The two fields being
        # read are top-level scalars, so a line-anchored regex over the raw text
        # is sufficient and avoids taking a dependency purely to fail fast.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ["TAG_NAME"]
          want = tag.removeprefix("v")
          errors = []

          pkg = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if pkg != want:
              errors.append(
                  f"pyproject.toml version {pkg!r} does not match tag {tag!r}. "
                  "Bump pyproject.toml before tagging."
              )

          cff_text = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")

          def scalar(field):
              m = re.search(
                  rf"^{re.escape(field)}:[ \t]*['\"]?([^'\"\s#]+)", cff_text, re.M
              )
              return m.group(1) if m else None

          cff_version = scalar("version")
          if cff_version is None:
              errors.append("CITATION.cff has no top-level 'version:' field.")
          elif cff_version != want:
              errors.append(
                  f"CITATION.cff version {cff_version!r} does not match tag {tag!r}. "
                  "Update CITATION.cff before tagging."
              )

          cff_date = scalar("date-released")
          today = datetime.datetime.now(datetime.UTC).date()
          if cff_date is None:
              errors.append("CITATION.cff has no top-level 'date-released:' field.")
          # date.fromisoformat alone is not enough: on Python 3.11+ it also
          # accepts the ISO basic form (20260923) and week dates (2026-W38-3),
          # while docs/releasing.md requires YYYY-MM-DD.
          elif not re.fullmatch(r"\d{4}-\d{2}-\d{2}", cff_date):
              errors.append(
                  f"CITATION.cff date-released {cff_date!r} is not in YYYY-MM-DD form."
              )
          else:
              try:
                  released = datetime.date.fromisoformat(cff_date)
              except ValueError:
                  errors.append(
                      f"CITATION.cff date-released {cff_date!r} is not an ISO date."
                  )
              else:
                  if released > today:
                      errors.append(
                          f"CITATION.cff date-released {cff_date} is in the future "
                          f"(today is {today}). A release cannot be dated ahead of itself."
                      )
                  # A release cannot predate the code it ships either. Without this the only
                  # bound was the future one, so a date left from an earlier release passed:
                  # v2.0.2 and v2.0.3 both shipped date-released 2026-06-12 against commits
                  # of 2026-06-16 and 2026-06-17.
                  committed = os.environ.get("COMMIT_DATE", "")
                  if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", committed):
                      errors.append(
                          f"COMMIT_DATE {committed!r} is not a YYYY-MM-DD date. The step "
                          f"before this one records it; without it the lower bound on "
                          f"date-released cannot be checked, so this fails closed."
                      )
                  elif released < datetime.date.fromisoformat(committed):
                      errors.append(
                          f"CITATION.cff date-released {cff_date} precedes the commit it "
                          f"tags ({committed}). Update it to the release date."
                      )

          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)

          print(
              f"Version check OK: tag={tag} pyproject={pkg} "
              f"CITATION.cff={cff_version} date-released={cff_date}"
          )
          PY

      - name: Build sdist and wheel
        # setuptools build backend (see pyproject.toml [build-system]); building the
        # source/wheel distribution does not import the heavy ML runtime deps.
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   python tools/update_dependencies.py --ci-env build
        #   (wraps `uv pip compile`; the .txt header records the exact argv)
        # The lock carries the backend too (setuptools, wheel), and --no-isolation
        # makes the build use it. Without the flag `build` creates a throwaway
        # environment and pip-installs [build-system].requires into it from PyPI
        # with no hashes, once for the sdist and once for the wheel, so the
        # published artifacts were built by whatever setuptools and wheel PyPI
        # served that day. `build` still checks those requirements against the
        # environment and refuses to run if one is missing.
        run: |
          pip install --require-hashes -r environments/requirements-ci-build.txt
          python -m build --no-isolation --sdist --wheel --outdir dist/

      - name: Verify JSON package data in built distributions
        # src/verify/structural_gnn.py reads mhc_pseudo_sequences.json at
        # runtime, and only pyproject.toml's [tool.setuptools.package-data]
        # entry puts it and targets.json into these archives. The
        # install-and-import gate below never imports src.verify, so it cannot
        # see them go missing; this step reads the member lists of the exact
        # files this job publishes. tests/test_package_data_declaration.py
        # checks the same declaration at pull-request time.
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          required = {
              "src/verify/mhc_pseudo_sequences.json",
              "src/verify/targets.json",
          }
          wheel_paths = glob.glob("dist/*.whl")
          sdist_paths = glob.glob("dist/*.tar.gz")
          if len(wheel_paths) != 1 or len(sdist_paths) != 1:
              raise SystemExit(
                  f"expected one wheel and one sdist, got {wheel_paths=} {sdist_paths=}"
              )

          with zipfile.ZipFile(wheel_paths[0]) as archive:
              wheel_names = set(archive.namelist())
          with tarfile.open(sdist_paths[0]) as archive:
              sdist_names = {
                  "/".join(name.split("/")[1:]) for name in archive.getnames() if "/" in name
              }

          missing_by_artifact = {}
          for artifact, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              print(f"{artifact} member count: {len(names)}")
              missing = sorted(required - names)
              if missing:
                  missing_by_artifact[artifact] = missing
              else:
                  print(f"{artifact} contains required package data: {sorted(required)}")
          if missing_by_artifact:
              raise SystemExit(f"built distributions are missing package data: {missing_by_artifact}")
          PY

      - name: Build canonical results bundle (checksummed zip of tracked results/ artifacts)
        # Stdlib-only (hashlib/json/zipfile) - no ML runtime deps needed. Lets a reader
        # verify a published release's result artifacts byte-for-byte via the bundle's
        # own manifest, independent of the sdist/wheel above.
        run: python -m src.release_bundle --output-dir dist_release_bundle

      - name: Record the artifact digests
        id: digests
        # The release job downloads the artifact by name, and a later job in this
        # run could replace an artifact of the same name (upload-artifact's
        # `overwrite`). So the release job checks every downloaded file against
        # these digests, which are this job's output and so cannot be changed by
        # anything that runs after it, including the verify job's unhashed
        # install.
        run: |
          {
            echo 'sha256<<DIGESTS_END'
            sha256sum dist/*.tar.gz dist/*.whl dist_release_bundle/*.zip dist_release_bundle/*.manifest.json
            echo 'DIGESTS_END'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the built artifacts for verification, signing and release
        # The pre-publish gate runs in the verify job against this upload, and the
        # release job needs it, so nothing is signed or published unless it passes.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist_release_bundle/*.zip
            dist_release_bundle/*.manifest.json
          retention-days: 1

  verify:
    name: Verify the built wheel installs and imports
    needs: build
    runs-on: ubuntu-latest
    # The pre-publish gate used to run inside the build job, after the build and
    # before the upload. It installs the wheel WITH dependencies from PyPI, which
    # is unhashed by design (see the step), and then imports the package and runs
    # its CLI, so third-party code ran as the same user, on the same runner, while
    # dist/ was still writable and not yet uploaded: a compromised dependency
    # release could have altered the artifacts that the release job then attests
    # and publishes. Here it runs on its own runner against the artifact the build
    # job already uploaded, and the release job needs this job, so a failing gate
    # still stops the release. No OIDC token is held here and its permissions
    # are read-only; the release job also checks the artifact against the build
    # job's digests, so this job cannot swap it either. The artifact is kept for
    # one day: re-running this job alone after that fails at the download, so
    # re-run the whole workflow instead.
    # Same bound as the build job, whose time this install used to take.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # For environments/requirements-pip-bootstrap.txt and
        # scripts/check_consumer_install.py; the distributions come from the artifact.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.ref_name }}
          path: .

      - name: Verify the built wheel installs and imports (PRE-PUBLISH GATE)
        # The last point at which a bad package is still recoverable. The
        # post-upload smoke test in the smoke job cannot serve this purpose:
        # it runs AFTER gh-action-pypi-publish, and PyPI permanently refuses a
        # re-upload of the same version, so a failure there burns the version
        # number and leaves a broken release published for good.
        #
        # Installs WITH dependencies on purpose. The point is to prove that
        # [project].dependencies is sufficient to import the package - an AST
        # audit on 2026-08-14 found seven distributions imported at module scope
        # in the packaged trees and declared nowhere, including biopython and
        # mhcflurry, which `sestrav predict` reaches through stages 1 and 2.
        #
        # All four functions/stage*.py modules are imported below, not just
        # stage 1. Until 2026-08-16 this step only proved stage 1 importable,
        # which is why an eighth undeclared dependency (matplotlib, reached
        # only via stage 4's score_immunogenicity()) passed here silently -
        # `sestrav predict` would have died on it after clearing this gate.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/python -m pip install --quiet --require-hashes --no-deps -r environments/requirements-pip-bootstrap.txt
          /tmp/relcheck/bin/python -m pip install --quiet dist/*.whl
          /tmp/relcheck/bin/python - <<'PY'
          import os
          import sys
          import sestrav

          expected = os.environ["TAG_NAME"].removeprefix("v")
          if sestrav.__version__ != expected:
              print(
                  f"::error::installed sestrav {sestrav.__version__!r} does not match "
                  f"tag {expected!r}"
              )
              sys.exit(1)
          print("import sestrav OK", sestrav.__version__)
          PY
          # The import list is DERIVED, not hardcoded. The hardcoded form has
          # already failed once in exactly the way a hardcoded list fails: until
          # 2026-08-16 it named stage 1 only, so matplotlib - reached through
          # stage 4 - cleared this gate while declared nowhere.
          # scripts/check_consumer_install.py walks src/cli.py's module-scope
          # imports plus the lazy imports inside every cmd_* function and follows
          # them transitively, so a new command or a new module is covered without
          # anyone remembering to edit this file. It also fails when a subparser
          # has no cmd_ function or a cmd_ function no parser advertises, which is
          # how this coverage would otherwise go quietly stale again.
          #
          # It is scoped to reachability from a shipped command, not to every
          # module in the wheel: src/optimizer.py imports pulp from the dev extra
          # and no command reaches it, so importing everything would fail here and
          # push pulp into every consumer's install for nothing.
          #
          # Run from outside the checkout with --require-installed so the imports
          # resolve to the wheel just installed and not to the source tree in
          # $GITHUB_WORKSPACE. Without that flag the whole check is vacuous, and
          # the flag makes that failure loud instead of silent.
          ( cd /tmp && /tmp/relcheck/bin/python               "${GITHUB_WORKSPACE}/scripts/check_consumer_install.py"               --root "${GITHUB_WORKSPACE}" --require-installed )

          /tmp/relcheck/bin/sestrav --help > /dev/null
          echo "sestrav --help OK"
          # `for command in $(...)` discarded the list producer's exit status and
          # ran zero iterations on empty output, so a --list-commands that failed
          # or printed nothing left this step green while exercising no command at
          # all. That is not hypothetical: on a parser/implementation mismatch
          # --list-commands prints the names AND returns 1, so the discarded
          # status was the only signal able to fail the step (its stderr WIRING
          # line reaches the log but fails nothing). The list is therefore captured
          # by a command of its own, whose failure `-e` does see, and then
          # required to be non-empty before the loop. Guarded by
          # tests/test_release_workflow_oidc_install_isolation.py::test_the_subcommand_help_loop_fails_on_an_empty_or_failed_list
          commands="$(/tmp/relcheck/bin/python \
            "${GITHUB_WORKSPACE}/scripts/check_consumer_install.py" \
            --root "${GITHUB_WORKSPACE}" --list-commands)"
          test -n "$commands"
          for command in $commands; do
            /tmp/relcheck/bin/sestrav "$command" --help > /dev/null
            echo "sestrav $command --help OK"
          done

  release:
    name: Attest and publish signed release
    needs: [build, verify]
    runs-on: ubuntu-latest
    # 15 is the bound ci.yml's compat job and security.yml's pip-audit and
    # python-sbom jobs already carry. This job downloads one artifact and then
    # makes authenticated network calls (Sigstore signing, gh release create). It
    # neither builds nor resolves dependencies, so it is bounded by network
    # round-trips rather than by compute.
    timeout-minutes: 15
    permissions:
      contents: write       # create the GitHub Release and upload assets
      id-token: write       # OIDC token for keyless Sigstore signing
      attestations: write   # store the build-provenance attestation
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.ref_name }}
          path: .

      - name: Check the artifact against the build job's digests
        # Before anything is attested: every file must match the digest the build
        # job recorded (an output, fixed when that job ended), and no file may have
        # been added. Tested with a tampered wheel, an extra file and an empty
        # digest list, each of which fails this step. Keep it a list of plain
        # pipelines, immediately before the step it guards: digest_check_problems
        # in tests/test_release_workflow_oidc_install_isolation.py fails anything
        # that could disarm it.
        env:
          EXPECTED: ${{ needs.build.outputs.artifact-sha256 }}
        run: |
          test -n "$EXPECTED"
          printf '%s\n' "$EXPECTED" | sha256sum --check --strict -
          printf '%s\n' "$EXPECTED" | awk '{print $2}' | sort > "$RUNNER_TEMP/expected-files.txt"
          find dist dist_release_bundle -type f | sort > "$RUNNER_TEMP/downloaded-files.txt"
          diff "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/downloaded-files.txt"

      - name: Attest build provenance (keyless SLSA)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.whl,dist_release_bundle/*.zip"

      - name: Copy the attestation bundle into dist/ for release upload
        # actions/attest-build-provenance (v4.2.2, wrapping actions/attest v4.2.1)
        # writes ONE bundle file covering every subject in subject-path and reports
        # its path as `bundle-path` - verified in that action's own bundled
        # dist/index.js (run() in src/main.ts) at the pinned SHA, not from its
        # README: `subjects = await subjectFromInputs(...)` collects every matched
        # file into a single array, `createAttestation(subjects, ...)` signs them
        # together, and the result is written once to
        # `path.join(tempDir(), 'attestation.json')` before that same path is
        # returned as `bundle-path`. So this step's `cp` runs exactly once
        # regardless of how many dist files matched above.
        #
        # The file is a Sigstore bundle (media type
        # application/vnd.dev.sigstore.bundle.v0.3+json, per BUNDLE_V03_MEDIA_TYPE
        # in that same dist/index.js) whose DSSE payload is an in-toto statement.
        # OpenSSF Scorecard's Signed-Releases check (releasesHaveProvenance probe,
        # probes/releasesHaveProvenance/impl.go at the pinned c395761 revision)
        # matches a release ASSET NAME by suffix against `.intoto.jsonl` and never
        # downloads or parses the file - `strings.HasSuffix(asset.Name, suffix)`
        # is the entire check - so the name below is chosen for that suffix, not
        # because the bundle is JSON Lines by any stricter definition (the action
        # does write it with one trailing newline via an append-mode write, so it
        # is in fact one valid JSONL line).
        #
        # `test -s` is the operative guard for both an empty and a missing file;
        # `${{ steps.attest.outputs.bundle-path }}` is always ASSIGNED by `env:`
        # below (possibly to an empty string), so `set -u` alone would not catch
        # an empty output the way it catches a genuinely unset shell variable.
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "${BUNDLE_PATH}"
          cp "${BUNDLE_PATH}" "dist/sestrav-${GITHUB_REF_NAME#v}.intoto.jsonl"

      - name: Generate SHA-256 checksum manifest
        # Runs after the attestation copy above (moved from its earlier position
        # ahead of the attest step) so SHA256SUMS.txt covers every file actually
        # published in dist/, the new .intoto.jsonl included, rather than being
        # generated before that file existed.
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release with artifacts + checksums
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot infer the repository from a git
          # remote, and gh does not read GITHUB_REPOSITORY; name it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.whl dist/SHA256SUMS.txt dist/*.intoto.jsonl \
            dist_release_bundle/*.zip dist_release_bundle/*.manifest.json \
            --title "SESTRAV ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Upload dist artifacts for publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.ref_name }}
          # Distributions ONLY. gh-action-pypi-publish runs `twine upload dist/*`
          # unfiltered, and twine raises InvalidDistribution on any extension
          # outside .whl/.tar.gz/.zip - so shipping dist/SHA256SUMS.txt through to
          # the publish job would fail the upload. It is still attached to the
          # GitHub Release above, which reads it from this job's own dist/.
          path: |
            dist/*.tar.gz
            dist/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    # build: for the digests it recorded, which the step after the download checks.
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate: set repository variable PYPI_PUBLISH=true (Settings -> Variables -> Actions).
    # Keeping the toggle in a non-secret variable makes the condition evaluable at
    # job-scheduling time (secrets context is unavailable in job-level `if` expressions).
    # Authentication uses OIDC Trusted Publishers - no API token or secret required.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/sestrav
    permissions:
      contents: read
      id-token: write    # required for OIDC trusted publisher authentication
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Check the distributions against the build job's digests
        # This is a second artifact, uploaded by the release job and fetched by
        # name, so it is checked the same way as the release job's download
        # before anything reaches PyPI: the sdist and wheel must match the
        # digests the build job recorded for dist/, and no file may have been
        # added. The note on keeping the release job's check armed applies here.
        env:
          EXPECTED: ${{ needs.build.outputs.artifact-sha256 }}
        run: |
          printf '%s\n' "$EXPECTED" | grep -E '^[0-9a-f]{64}  dist/[^/]+$' > "$RUNNER_TEMP/dist.sha256"
          test -s "$RUNNER_TEMP/dist.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/dist.sha256"
          awk '{print $2}' "$RUNNER_TEMP/dist.sha256" | sort > "$RUNNER_TEMP/expected-files.txt"
          find dist -type f | sort > "$RUNNER_TEMP/downloaded-files.txt"
          diff "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/downloaded-files.txt"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  smoke:
    name: Smoke-test the published package
    needs: publish
    runs-on: ubuntu-latest
    # 20, the bound security.yml's codeql job already carries, rather than the 10
    # the single-purpose gates use: the install step below tries five times and
    # sleeps 30 seconds after each failed attempt (two and a half minutes of
    # sleeps on its own), and every attempt resolves the full dependency closure.
    # A kill here does not un-publish anything, and only this job needs
    # re-running; the bound is generous because a spurious failure marks an
    # already-published release red.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Python for smoke test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Smoke-test installation from PyPI
        # Confirms PyPI actually serves the artifact. Importability is already
        # proven by the PRE-PUBLISH GATE in the verify job, so the job of this
        # step is narrower - and it retries instead of failing on the first
        # miss, because a fresh upload can take a little while to reach the CDN.
        # A failure here does not un-publish anything, and because this is its
        # own job it can be re-run alone, without re-running `publish`.
        #
        # `--no-deps` was removed on 2026-08-14. It could never have worked:
        # `import sestrav` reaches src.features (pandas, numpy) and
        # functions.stage1_peptide_generation imports biopython, so with no
        # dependencies installed both probes raise ModuleNotFoundError.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          installed=""
          for attempt in 1 2 3 4 5; do
            if pip install "sestrav==${VERSION}" --index-url https://pypi.org/simple/; then
              installed=yes
              break
            fi
            echo "Attempt ${attempt}/5 failed; PyPI may not have propagated yet. Retrying in 30s."
            sleep 30
          done
          if [ -z "$installed" ]; then
            echo "::error::sestrav==${VERSION} is published but could not be installed from PyPI after 5 attempts."
            exit 1
          fi
          python -c "import sestrav; print('sestrav import OK', sestrav.__version__)"
          python -c "
          import functions.stage1_peptide_generation
          import functions.stage2_mhc_binding_prediction
          import functions.stage3_tcr_feature_extraction
          import functions.stage4_immunogenicity_scoring
          print('functions.stage1-4 import OK')
          "
          sestrav --help > /dev/null
          echo "sestrav --help OK"
