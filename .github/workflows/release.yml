name: Release (signed + provenance)

# Builds the Python distribution on a version tag, generates a SHA-256 manifest,
# produces a keyless SLSA build-provenance attestation (Sigstore via GitHub OIDC -
# no maintainer-managed signing keys), and publishes everything to a GitHub
# Release. This satisfies OpenSSF `signed_releases`: consumers can cryptographically
# verify an artifact came from this repo's CI with:
#
#   gh attestation verify <artifact> --repo Gavin-Borges/SESTRAV
#
# See docs/releasing.md and SECURITY.md "Release Integrity & Verification".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, attest, and publish signed release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release and upload assets
      id-token: write        # OIDC token for keyless Sigstore signing
      attestations: write    # store the build-provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        # Fail fast (before building) if the pushed tag does not match
        # pyproject.toml [project].version, so release artifacts can never be
        # mislabelled. Bump pyproject before tagging (see docs/releasing.md).
        #
        # CITATION.cff is checked here too. Until 2026-08-14 nothing in CI, the
        # tests, the scripts or the integrity harness referenced that file at
        # all, which is how the W6 "phantom release" happened: CITATION.cff
        # advertised 2.1.0 dated 2026-08-07 while no such tag existed.
        #
        # CITATION.cff is YAML, but this step runs before any dependency is
        # installed, so there is no YAML parser available. The two fields being
        # read are top-level scalars, so a line-anchored regex over the raw text
        # is sufficient and avoids taking a dependency purely to fail fast.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ["TAG_NAME"]
          want = tag.removeprefix("v")
          errors = []

          pkg = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if pkg != want:
              errors.append(
                  f"pyproject.toml version {pkg!r} does not match tag {tag!r}. "
                  "Bump pyproject.toml before tagging."
              )

          cff_text = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")

          def scalar(field):
              m = re.search(
                  rf"^{re.escape(field)}:[ \t]*['\"]?([^'\"\s#]+)", cff_text, re.M
              )
              return m.group(1) if m else None

          cff_version = scalar("version")
          if cff_version is None:
              errors.append("CITATION.cff has no top-level 'version:' field.")
          elif cff_version != want:
              errors.append(
                  f"CITATION.cff version {cff_version!r} does not match tag {tag!r}. "
                  "Update CITATION.cff before tagging."
              )

          cff_date = scalar("date-released")
          today = datetime.datetime.now(datetime.UTC).date()
          if cff_date is None:
              errors.append("CITATION.cff has no top-level 'date-released:' field.")
          else:
              try:
                  released = datetime.date.fromisoformat(cff_date)
              except ValueError:
                  errors.append(
                      f"CITATION.cff date-released {cff_date!r} is not an ISO date."
                  )
              else:
                  if released > today:
                      errors.append(
                          f"CITATION.cff date-released {cff_date} is in the future "
                          f"(today is {today}). A release cannot be dated ahead of itself."
                      )

          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)

          print(
              f"Version check OK: tag={tag} pyproject={pkg} "
              f"CITATION.cff={cff_version} date-released={cff_date}"
          )
          PY

      - name: Build sdist and wheel
        # setuptools build backend (see pyproject.toml [build-system]); building the
        # source/wheel distribution does not import the heavy ML runtime deps.
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies). Regenerate with:
        #   pip-compile --generate-hashes environments/requirements-ci-build.in \
        #     --output-file environments/requirements-ci-build.txt --no-emit-index-url
        run: |
          pip install --require-hashes -r environments/requirements-ci-build.txt
          python -m build --sdist --wheel --outdir dist/

      - name: Verify the built wheel installs and imports (PRE-PUBLISH GATE)
        # The last point at which a bad package is still recoverable. The
        # post-upload smoke test in the publish job cannot serve this purpose:
        # it runs AFTER gh-action-pypi-publish, and PyPI permanently refuses a
        # re-upload of the same version, so a failure there burns the version
        # number and leaves a broken release published for good.
        #
        # Installs WITH dependencies on purpose. The point is to prove that
        # [project].dependencies is sufficient to import the package - an AST
        # audit on 2026-08-14 found seven distributions imported at module scope
        # in the packaged trees and declared nowhere, including biopython and
        # mhcflurry, which `sestrav predict` reaches through stages 1 and 2.
        #
        # All four functions/stage*.py modules are imported below, not just
        # stage 1. Until 2026-08-16 this step only proved stage 1 importable,
        # which is why an eighth undeclared dependency (matplotlib, reached
        # only via stage 4's score_immunogenicity()) passed here silently -
        # `sestrav predict` would have died on it after clearing this gate.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/python -m pip install --quiet --upgrade pip
          /tmp/relcheck/bin/python -m pip install --quiet dist/*.whl
          /tmp/relcheck/bin/python - <<'PY'
          import os
          import sys
          import sestrav

          expected = os.environ["TAG_NAME"].removeprefix("v")
          if sestrav.__version__ != expected:
              print(
                  f"::error::installed sestrav {sestrav.__version__!r} does not match "
                  f"tag {expected!r}"
              )
              sys.exit(1)
          print("import sestrav OK", sestrav.__version__)
          PY
          /tmp/relcheck/bin/python -c "
          import functions.stage1_peptide_generation
          import functions.stage2_mhc_binding_prediction
          import functions.stage3_tcr_feature_extraction
          import functions.stage4_immunogenicity_scoring
          print('import functions.stage1-4 OK')
          "
          /tmp/relcheck/bin/python -c "import src.cli; print('import src.cli OK')"
          /tmp/relcheck/bin/sestrav --help > /dev/null
          echo "sestrav --help OK"

      - name: Generate SHA-256 checksum manifest
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build canonical results bundle (checksummed zip of tracked results/ artifacts)
        # Stdlib-only (hashlib/json/zipfile) - no ML runtime deps needed. Lets a reader
        # verify a published release's result artifacts byte-for-byte via the bundle's
        # own manifest, independent of the sdist/wheel above.
        run: python -m src.release_bundle --output-dir dist_release_bundle

      - name: Attest build provenance (keyless SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.whl,dist_release_bundle/*.zip"

      - name: Publish GitHub Release with artifacts + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.whl dist/SHA256SUMS.txt \
            dist_release_bundle/*.zip dist_release_bundle/*.manifest.json \
            --title "SESTRAV ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Upload dist artifacts for publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.ref_name }}
          # Distributions ONLY. gh-action-pypi-publish runs `twine upload dist/*`
          # unfiltered, and twine raises InvalidDistribution on any extension
          # outside .whl/.tar.gz/.zip - so shipping dist/SHA256SUMS.txt through to
          # the publish job would fail the upload. It is still attached to the
          # GitHub Release above, which reads it from this job's own dist/.
          path: |
            dist/*.tar.gz
            dist/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    # Gate: set repository variable PYPI_PUBLISH=true (Settings -> Variables -> Actions).
    # Keeping the toggle in a non-secret variable makes the condition evaluable at
    # job-scheduling time (secrets context is unavailable in job-level `if` expressions).
    # Authentication uses OIDC Trusted Publishers - no API token or secret required.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/sestrav
    permissions:
      contents: read
      id-token: write    # required for OIDC trusted publisher authentication
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Set up Python for smoke test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Smoke-test installation from PyPI
        # Confirms PyPI actually serves the artifact. Importability is already
        # proven by the PRE-PUBLISH GATE in the release job, so the job of this
        # step is narrower - and it retries instead of failing on the first
        # miss, because a fresh upload can take a little while to reach the CDN
        # and a failure here is NOT fixable by re-running: the version is
        # already published and PyPI will not accept it twice.
        #
        # `--no-deps` was removed on 2026-08-14. It could never have worked:
        # `import sestrav` reaches src.features (pandas, numpy) and
        # functions.stage1_peptide_generation imports biopython, so with no
        # dependencies installed both probes raise ModuleNotFoundError.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          installed=""
          for attempt in 1 2 3 4 5; do
            if pip install "sestrav==${VERSION}" --index-url https://pypi.org/simple/; then
              installed=yes
              break
            fi
            echo "Attempt ${attempt}/5 failed; PyPI may not have propagated yet. Retrying in 30s."
            sleep 30
          done
          if [ -z "$installed" ]; then
            echo "::error::sestrav==${VERSION} is published but could not be installed from PyPI after 5 attempts."
            exit 1
          fi
          python -c "import sestrav; print('sestrav import OK', sestrav.__version__)"
          python -c "
          import functions.stage1_peptide_generation
          import functions.stage2_mhc_binding_prediction
          import functions.stage3_tcr_feature_extraction
          import functions.stage4_immunogenicity_scoring
          print('functions.stage1-4 import OK')
          "
          sestrav --help > /dev/null
          echo "sestrav --help OK"
