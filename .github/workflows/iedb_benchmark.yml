name: Monthly IEDB Benchmark

on:
  schedule:
    - cron: '0 8 1 * *'   # first of every month at 08:00 UTC
  workflow_dispatch:        # allow manual trigger for testing

permissions:
  contents: read
  issues: write            # open regression alerts as GitHub Issues

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: pip install --require-hashes -r environments/requirements.lock

      - name: Install SESTRAV (no additional deps)
        run: pip install --no-deps -e .

      - name: Fetch latest IEDB T-cell data (EBV + HPV16)
        run: |
          mkdir -p data_tmp/iedb
          python scripts/fetch_iedb_tcell.py --virus EBV   --output data_tmp/iedb/ebv_tcell.csv
          python scripts/fetch_iedb_tcell.py --virus HPV16 --output data_tmp/iedb/hpv16_tcell.csv

      - name: Score with production model, compare to baseline, flag regression
        run: |
          # Scoring + baseline comparison + >3% regression detection live in
          # src/continuous_validation.py so the logic is unit-tested
          # (tests/test_continuous_validation.py). Model + binding-matrix paths
          # resolve from config.yaml; baseline from data/validation_baselines.json.
          #
          # --require-measurement makes "could not score" exit 2 instead of 0.
          # Without it this job was GREEN WITHOUT MEASURING ANYTHING: config.yaml
          # points model_path at models/rf_31feature_integrated.joblib, .gitignore
          # excludes models/*.joblib, and nothing in this workflow supplies one, so
          # the run took the "Model not found ... Skipping AUC-PR computation"
          # branch every time. Observed on run 33512393850 (2026-09-01), conclusion
          # "success", which scored nothing, uploaded no artifact and opened no
          # issue. A red monthly run saying "could not measure" is the honest
          # result; turning it green again needs a model in CI, which is an owner
          # decision and is deliberately not made here.
          python -m src.continuous_validation \
            --inputs data_tmp/iedb/ebv_tcell.csv data_tmp/iedb/hpv16_tcell.csv \
            --baseline data/validation_baselines.json \
            --results-dir results/continuous_validation \
            --require-measurement

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iedb-benchmark-${{ github.run_id }}
          path: results/continuous_validation/benchmark_latest.json
          # error, not warn. The scoring step above now fails when it could not
          # measure, so if control reaches here the benchmark DID run and the
          # artifact must exist; a missing file is then a real defect rather than
          # the expected skip. Under `warn` this step printed "No files were found"
          # and the job still went green, which is the second of the two fail-opens
          # this change closes.
          if-no-files-found: error

      - name: Open GitHub Issue on regression
        if: hashFiles('REGRESSION_DETECTED') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const msg = fs.readFileSync('REGRESSION_DETECTED', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Automated] Monthly IEDB benchmark AUC-PR regression`,
              body: `The monthly IEDB benchmark detected a performance regression.\n\n${msg}\n\nSee workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['regression', 'automated'],
            });
