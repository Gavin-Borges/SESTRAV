name: Monthly IEDB Benchmark

on:
  schedule:
    - cron: '0 8 1 * *'   # first of every month at 08:00 UTC
  workflow_dispatch:        # allow manual trigger for testing

permissions:
  contents: read
  issues: write            # open regression alerts as GitHub Issues

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: pip install --require-hashes -r environments/requirements.lock

      - name: Install SESTRAV (no additional deps)
        run: pip install --no-deps -e .

      - name: Fetch latest IEDB T-cell data (EBV + HPV16)
        run: |
          mkdir -p data_tmp/iedb
          python scripts/fetch_iedb_tcell.py --virus EBV   --output data_tmp/iedb/ebv_tcell.csv
          python scripts/fetch_iedb_tcell.py --virus HPV16 --output data_tmp/iedb/hpv16_tcell.csv

      - name: Score with production model, compare to baseline, flag regression
        run: |
          # Scoring + baseline comparison + >3% regression detection live in
          # src/continuous_validation.py so the logic is unit-tested
          # (tests/test_continuous_validation.py). Model + binding-matrix paths
          # resolve from config.yaml; baseline from data/validation_baselines.json.
          python -m src.continuous_validation \
            --inputs data_tmp/iedb/ebv_tcell.csv data_tmp/iedb/hpv16_tcell.csv \
            --baseline data/validation_baselines.json \
            --results-dir results/continuous_validation

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: iedb-benchmark-${{ github.run_id }}
          path: results/continuous_validation/benchmark_latest.json
          if-no-files-found: warn

      - name: Open GitHub Issue on regression
        if: hashFiles('REGRESSION_DETECTED') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const msg = fs.readFileSync('REGRESSION_DETECTED', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Automated] Monthly IEDB benchmark AUC-PR regression`,
              body: `The monthly IEDB benchmark detected a performance regression.\n\n${msg}\n\nSee workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['regression', 'automated'],
            });
