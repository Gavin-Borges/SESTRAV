rules:
  - id: sestrav-forbid-pickle-non-literal
    message: "Avoid using pickle.load with non-literal file paths to prevent unsafe deserialization of untrusted data."
    languages: [python]
    severity: ERROR
    patterns:
      - pattern: pickle.load($FILE)
      - pattern-not-inside: |
          with open("...", ...) as $FILE:
              ...
              pickle.load($FILE)
      - pattern-not-inside: |
          $FILE = open("...", ...)
          ...
          pickle.load($FILE)

  - id: sestrav-require-verified-joblib-load
    message: "Avoid direct usage of joblib.load, and any required_checksum or read_verified_bytes required flag that is not the literal True. Use src.artifact_integrity.load_verified_joblib with required_checksum=True (or the default) to prevent unsafe deserialization."
    languages: [python]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: joblib.load(...)
          # Any flag but the literal True: False, a variable or an expression
          # that can be False at run time, given by keyword, as the third
          # positional argument, or inside a **mapping. The default is True, so
          # a call that passes no flag is fine.
          - pattern: load_verified_joblib(..., required_checksum=$FLAG, ...)
          - pattern: load_verified_joblib($PATH, $MANIFEST, $FLAG, ...)
          - pattern: load_verified_joblib(..., **$OPTIONS)
          - pattern: load_verified_joblib(..., False, ...)
          # read_verified_bytes is load_verified_joblib's single read, and its
          # `required=False` is the same opt-out under another parameter name:
          # it returns bytes nothing checked when the manifest has no entry.
          # verify_artifact_library_versions(required=False) is deliberately NOT
          # here - drift warns by design, and src/baseline_comparison.py passes
          # verify_artifact_checksum(required=False) legitimately.
          - pattern: read_verified_bytes(..., required=$FLAG, ...)
          - pattern: read_verified_bytes($PATH, $MANIFEST, $FLAG, ...)
          - pattern: read_verified_bytes(..., **$OPTIONS)
          - pattern: read_verified_bytes(..., False, ...)
      - pattern-not: load_verified_joblib(..., required_checksum=True, ...)
      - pattern-not: load_verified_joblib($PATH, $MANIFEST, True)
      - pattern-not: read_verified_bytes(..., required=True, ...)
      - pattern-not: read_verified_bytes($PATH, $MANIFEST, True)
      - pattern-not-inside: |
          def load_verified_joblib(...):
              ...
      - pattern-not-inside: |
          def _load_joblib_impl(...):
              ...

  - id: sestrav-forbid-subprocess-shell-true
    message: "Avoid using shell=True in subprocess calls to prevent command injection."
    languages: [python]
    severity: ERROR
    pattern: subprocess.$FUNC(..., shell=True, ...)
