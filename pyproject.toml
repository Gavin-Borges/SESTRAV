[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sestrav"
version = "2.0.1"
description = "Structural Epitope Screening and T-cell Receptor AI Validation (SESTRAV)"
readme = "README.md"
authors = [
    {name = "Gavin Borges", email = "gavin.borges@uri.edu"}
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["immunology", "machine-learning", "epitope", "pytorch", "gnn"]
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "snakemake>=8.0.0",
    "joblib>=1.3.0",
    "requests>=2.31.0"
]

[project.urls]
"Homepage" = "https://github.com/gavin-borges/sestrav"
"Bug Tracker" = "https://github.com/gavin-borges/sestrav/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
sestrav = "src.verify.promote_gnn:promote_model"
