[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sestrav"
version = "2.0.0-rc1"
description = "Structural Epitope Screening and T-cell Receptor AI Validation (SESTRAV)"
readme = "README.md"
authors = [
    {name = "Gavin Borges", email = "gavin.borges@uri.edu"},
    {name = "Abdelrahman Eljamal"},
    {name = "Iris Schellenberg"},
    {name = "Charles Jouaneh"},
    {name = "Emine Byers"}
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["immunology", "machine-learning", "epitope", "pytorch", "gnn"]
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "snakemake>=8.0.0",
    "joblib>=1.3.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
demo = [
    "streamlit>=1.35.0",
    "shap>=0.44.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/gavin-borges/sestrav"
"Bug Tracker" = "https://github.com/gavin-borges/sestrav/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
sestrav = "src.verify.promote_gnn:promote_model"
