[build-system]
# Floor states the security requirement, not the current pin: setuptools 83.0.0
# closes GHSA-h35f-9h28-mq5c. requirements.in pins 84.0.0; see its comment there.
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sestrav"
version = "2.0.3"
description = "Structural Epitope Scoring via TCR Recognition And Vaccinology (SESTRAV)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Gavin Borges"},
    {name = "Abdelrahman Eljamal"},
    {name = "Iris Schellenberg"},
    {name = "Charles Jouaneh"},
    {name = "Emine Byers"}
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["immunology", "machine-learning", "epitope", "pytorch", "gnn"]
dependencies = [
    # Floored at 2.13.0 to close CVE-2025-3000 / GHSA-rrmf-rvhw-rf47 /
    # PYSEC-2025-194 (memory corruption in torch.jit.script, affected <= 2.12.1,
    # first patched 2.13.0). The compiled lockfiles already pin 2.13.0, but they
    # only govern hash-pinned installs; this floor is what stops a plain
    # `pip install -e .` or a downstream consumer from resolving a vulnerable
    # torch. SESTRAV does not call torch.jit.script, so this is defence in depth
    # rather than an exploitable-path fix. See SECURITY.md.
    "torch>=2.13.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
    # Added 2026-08-14 after an AST audit of every module-scope import in the
    # three packaged trees (sestrav/, src/, functions/) found seven distributions
    # imported but declared nowhere. They were never missing from CI - all seven
    # are pinned in environments/requirements.lock - so the gap was in the
    # metadata a PyPI consumer resolves, not in the test environment. Floors are
    # set below the locked versions rather than at them, since nothing here
    # requires a recent feature.
    #   biopython  functions/stage1_peptide_generation - pipeline stage 1
    #   mhcflurry  functions/stage2_mhc_binding_prediction - pipeline stage 2
    # Both are reached by `sestrav predict`, so without them the flagship
    # command fails on a clean install (see src/cli.py cmd_predict).
    "biopython>=1.80",
    "mhcflurry>=2.1.0",
    #   PyYAML     src/core/config.py and 7 more - config.yaml is the engine's
    #              own config format. src/cli.py imports it lazily behind a
    #              try/except ImportError, but src/core/config.py does not.
    "PyYAML>=6.0",
    #   scipy      src/h2_tier_a_evaluation, src/external_benchmark_comparison.
    #              Arrives transitively via scikit-learn today; declared because
    #              relying on a transitive dependency is not a contract.
    "scipy>=1.11.0",
    #   xgboost    src/train_classifier - the production model is an RF/XGB
    #              ensemble, so this is not optional to training.
    "xgboost>=2.0.0",
    #   openpyxl   src/iedb_data_loader - IEDB ships .xlsx exports.
    "openpyxl>=3.1.0",
    #   networkx   src/features.compute_wl_features (lazy). Kept in the core set
    #              rather than the gnn extra because the caller is
    #              src/train_classifier, not a GNN-only path.
    "networkx>=3.0",
    # Added 2026-08-16, the eighth instance of the class the 2026-08-14 audit above
    # was meant to close. That audit checked whether a package was declared
    # ANYWHERE in this file, not in [project].dependencies specifically, so
    # matplotlib passed it silently by being declared only in the `demo` extra
    # below - the wrong scope for a module `sestrav predict` reaches unconditionally.
    #   matplotlib functions/stage4_immunogenicity_scoring.py imports it at
    #              module scope (`matplotlib.use("Agg")` / `pyplot as plt`) and
    #              score_immunogenicity() always writes two PNGs to results/ at
    #              the end of every run - not gated behind a flag. Reached by
    #              `sestrav predict`, the flagship command, via stage 4.
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
# GNN structural-comparison path (src/verify/structural_gnn.py).
# Requires a system-level PyG build; omit unless you need structural GNN benchmarks.
# Install from a source checkout with: pip install ".[gnn]"
gnn = [
    "torch-geometric>=2.5.0",
    "transformers>=4.30.0",
]
# Snakemake pipeline runner - only needed to execute pipeline.smk end-to-end.
# Install from a source checkout with: pip install ".[pipeline]"
pipeline = [
    "snakemake>=8.0.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.100.0",
    # fastapi and pydantic added 2026-09-01. They are NOT api-only in practice:
    # three tracked test modules import them at module scope
    # (tests/test_api_main.py, tests/test_api_log_injection.py,
    # tests/test_config_schema.py), so without them the documented
    # `pip install -e ".[dev]" && pytest` aborted during COLLECTION - zero tests
    # run, not three failures. Same class as the matplotlib move above: a package
    # declared in the wrong extra passes any check that only asks whether
    # pyproject.toml mentions it somewhere. Gated by
    # tests/test_dev_extra_runs_the_test_suite.py. Versions match [api]/[demo]
    # deliberately, so the three extras cannot drift into a resolver conflict.
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
demo = [
    "streamlit>=1.35.0",
    "shap>=0.44.0",
    # matplotlib moved to [project].dependencies 2026-08-16 - it was already a
    # hard requirement of the core predict path, not demo-specific. Listing it
    # here too would be a harmless duplicate; omitted so this extra only
    # names packages genuinely exclusive to it.
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
# scripts/ is not packaged (tool.setuptools.packages.find include is
# sestrav*, src*, functions*). Two distributions are imported unguarded at
# module scope by tracked scripts and were absent from this file:
#   pyahocorasick  scripts/benchmark_runner.py and
#                  scripts/filter_validation_cohorts.py (import name
#                  ahocorasick). Pinned in requirements.in.
#   mhcgnomes      scripts/ingest_iedb_negatives.py. Satisfied only
#                  transitively via mhcflurry; declared because relying on a
#                  transitive dependency is not a contract (same argument as
#                  scipy in [project].dependencies).
# Not added to [project].dependencies: that would burden every PyPI consumer
# with packages they cannot reach.
scripts = [
    "pyahocorasick>=2.3.0",
    "mhcgnomes>=3.33.0",
]

[project.scripts]
sestrav = "src.cli:main"

[project.urls]
"Homepage" = "https://github.com/Gavin-Borges/SESTRAV"
"Bug Tracker" = "https://github.com/Gavin-Borges/SESTRAV/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sestrav*", "src*", "functions*"]

[tool.setuptools.package-data]
# The two tracked non-.py files under the packaged source trees. Until this
# declaration, a built wheel carried zero data files - `src.verify`'s own
# mhc_pseudo_sequences.json was silently absent from every installed
# package (verified: a wheel built from `git archive HEAD` has 75 entries and
# no non-.py members outside its own `.dist-info/` metadata directory).
#
# The mechanism is NOT that setuptools defaults to excluding package data -
# it does not. Resolved against this very file (setuptools 83.0.0,
# `apply_configuration(Distribution(), "pyproject.toml")`), `include_package_data`
# comes back **True**; only a bare `Distribution()` with no pyproject applied
# reports `None`. Under pyproject.toml that flag is on by default.
#
# What it is on by default for is files the **sdist manifest** covers, and this
# project has neither a `MANIFEST.in` nor `setuptools-scm` (`[build-system]
# .requires` is setuptools + wheel only), so the manifest covers nothing and
# `include_package_data=True` has nothing to act on. Declaring the files here
# is what actually ships them.
"src.verify" = ["*.json"]

# ---------------------------------------------------------------------------
# Coding standards (OpenSSF Silver: coding_standards / coding_standards_enforced)
# ---------------------------------------------------------------------------
# Style is PEP 8, enforced automatically by Ruff (lint) and Ruff's
# black-compatible formatter. CI runs `ruff check .` as a required gate.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9 + F mirrors ruff's default selection; S adds flake8-bandit security checks.
# W (whitespace) and B (bugbear) are deferred until a dedicated cleanup pass.
# The ignores below are deliberate and documented, not blanket suppressions.
select = ["E4", "E7", "E9", "F", "S"]
ignore = [
    "E402",  # entry-point / benchmark scripts adjust sys.path or set the matplotlib backend before imports
    "E741",  # short identifiers (l, I, O) recur in mathematical / statistical expressions
    "F841",  # locals intentionally retained for readability in benchmark/experimental code
    # S-rules suppressed globally: these patterns are already reviewed and approved
    # via bandit nosec annotations; suppressing here avoids duplicate annotation burden.
    "S101",  # assert - legitimate in tests
    "S404",  # subprocess import - all uses reviewed (nosec B404)
    "S603",  # subprocess without shell=True - all uses list-form, safe (nosec B603)
    "S607",  # partial executable path - all executables are fixed constants (nosec B607)
    "S110",  # try/except/pass - all uses reviewed (nosec B110)
    "S310",  # urllib urlopen - all URLs are HTTPS and scheme-validated (nosec B310)
]

[tool.ruff.lint.per-file-ignores]
"scripts/stage*.py" = ["F821"]  # `snakemake` is a magic global injected by the Snakemake runtime
"scripts/*.py" = ["E722"]       # best-effort external-tool detection wrappers; failures are non-fatal and logged

# ---------------------------------------------------------------------------
# Static type checking
# ---------------------------------------------------------------------------
# Baseline: ignore missing stubs for third-party libraries (torch, pandas, etc.)
# so `mypy src/` runs cleanly on CI without requiring stub packages.
# Enforcement is gradual: errors in new code are blocked by the pre-commit hook;
# legacy errors are tracked in mypy.ini suppressions as they are fixed.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
# Strict overrides: off while legacy code is annotated incrementally.
strict = false
# Exclude generated/vendored paths and Snakemake entry points that use magic globals.
exclude = [
    "scripts/stage.*\\.py$",
]

# ---------------------------------------------------------------------------
# Coverage (OpenSSF Silver test_statement_coverage80 / Gold 90% + branch 80%)
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
# parallel + the tools/coverage_subprocess sitecustomize hook let child
# processes (tests that run e.g. `python src/data_curation_qc.py`) record their
# own coverage, which pytest-cov then combines. Without this such modules are
# undercounted as 0% even though tests exercise them.
parallel = true
source = ["src", "functions"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Honest hard floor. Corrected 2026-08-11: this comment previously read "the suite
# measured 34.37% branch-inclusive coverage on 2026-06-22 ... a hair under this
# floor". Both halves were retracted on 2026-08-08 (20687e0) - the figure was wrong
# by 13.5 points and the direction was backwards. The measurement is 49.36%
# branch-inclusive (2026-08-16, at a336360), so this floor is CLEARED, not missed.
# CHANGELOG.md recorded that correction as landing in three named locations; this
# config comment was a fourth site and was missed. See docs/claims_register.md D6.
# Updated 2026-08-16, and the same fourth-site miss recurred verbatim: the 2026-08-15
# re-measurement (49.71%) was written into D6's register row alone while this comment,
# ROADMAP.md and docs/security_compliance.md all kept asserting 47.88% as current -
# the very failure the sentence above records happening to the PREVIOUS correction of
# this same number. The figure moves with ordinary development (47.88 -> 49.71 ->
# 49.36 in nine days); re-measure it, never carry it forward.
# This gate prevents regressions and is local-DX only, not a CI/badge gate. The
# CI-enforced gate is fail_under = 95 in .coveragerc.library. It is deliberately NOT
# the OpenSSF Silver target of 80%;
# raising it is tracked as a coverage ratchet in ROADMAP.md and must only move
# up as real tests land - never by padding.
fail_under = 35
